# Competence priors: see COMPETENCE.md in this directory.
id: openai
name: OpenAI
kind: cloud
adapter: ai-sdk:openai
baseUrl: https://api.openai.com/v1
baseUrlEnv: OPENAI_BASE_URL
auth:
  env: OPENAI_API_KEY
jurisdiction: US
retention: 'API default retention; see provider policy'
models:
